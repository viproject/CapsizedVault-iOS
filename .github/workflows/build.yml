name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix submodule if pinned commit is unavailable
        run: |
          cd Modules/CapsizedMoneroKit.Swift
          if [ -z "$(ls -A Sources 2>/dev/null)" ]; then
            git fetch origin
            git checkout origin/main
          fi
          cd ../..

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CapsizedVault.xcodeproj \
            -scheme CapsizedVault \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
