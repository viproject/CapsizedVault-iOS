name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix submodule if pinned commit is unavailable
        run: |
          cd Modules/CapsizedMoneroKit.Swift
          if [ -z "$(ls -A Sources 2>/dev/null)" ]; then
            git fetch origin
            git checkout origin/main
          fi
          cd ../..

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CapsizedVault.xcodeproj \
            -scheme CapsizedVault \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  publish-dsym:
    name: Publish dSYM
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix submodule if pinned commit is unavailable
        run: |
          cd Modules/CapsizedMoneroKit.Swift
          if [ -z "$(ls -A Sources 2>/dev/null)" ]; then
            git fetch origin
            git checkout origin/main
          fi
          cd ../..

      - name: Archive (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CapsizedVault.xcodeproj \
            -scheme CapsizedVault \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CapsizedVault.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package dSYM
        run: |
          zip -r CapsizedVault.dSYM.zip \
            build/CapsizedVault.xcarchive/dSYMs/CapsizedVault.app.dSYM

      - name: Upload dSYM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CapsizedVault.dSYM.zip
